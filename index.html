<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher Bridge</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #f5f5f7;
  }
  h1 { font-size: 20px; }
  #status { color: #666; font-size: 14px; margin-bottom: 12px; min-height: 18px; }
  textarea {
    width: 100%;
    min-height: 240px;
    font-size: 16px;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    resize: vertical;
  }
  .actions { margin-top: 12px; display: flex; gap: 8px; }
  button {
    font-size: 15px;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #0071e3;
    color: white;
    cursor: pointer;
  }
  button.secondary { background: #e5e5ea; color: #1a1a1a; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>Cipher Bridge</h1>
  <p id="status">Loading...</p>
  <button id="sign-in-button" style="display:none">Sign in with Apple ID</button>
  <textarea id="dictation-text" readonly placeholder="Nothing sent yet - dictate on your phone, then tap &quot;Send to Work Bridge.&quot;"></textarea>
  <div class="actions">
    <button id="copy-button">Copy</button>
    <button id="refresh-button" class="secondary" style="display:none">Refresh</button>
  </div>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
